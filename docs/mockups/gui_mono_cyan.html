<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
:root {
  --bg:#000000;
  --panel:#1a1a1a;
  --panel-2:#242424;
  --accent-panel:#141414;
  --accent-border:#26e0ff;
  --white:#ffffff;
  --dim:#b0b0b0;
  --muted:#707070;
  --cyan:#26e0ff;
  --danger:#ff3b3b;
  --bar-bg:#2c2c2c;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:#050505; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
.screen { width:800px; height:480px; background:var(--bg); position:relative; overflow:hidden; margin:12px auto; border:1px solid #1a1a1a; }
.row { position:absolute; left:12px; right:12px; }
.label { color:var(--dim); font-size:12px; font-weight:600; letter-spacing:0.3px; }
.value { color:var(--white); font-weight:700; }
.sub { color:var(--muted); font-size:11px; font-weight:600; }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px; vertical-align:middle; }
.tag { position:absolute; top:-26px; left:0; font-size:13px; color:var(--cyan); font-weight:700; }

.topbar { top:14px; height:32px; background:var(--panel); display:flex; align-items:center; padding:0 16px; justify-content:space-between; border-left:2px solid var(--cyan); }
.topbar .side { display:flex; align-items:center; gap:16px; }

.cluster { top:54px; height:154px; background:var(--accent-panel); border:2px solid var(--accent-border);
  display:flex; align-items:stretch; padding:14px; gap:10px; }
.flank { flex:0 0 21%; display:flex; flex-direction:column; gap:8px; }
.flank .cell { flex:1; background:var(--panel-2); border-radius:2px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.flank .cell .value { font-size:16px; }
.flank .cell .label { font-size:10px; }
.hero-center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.hero-center .num { font-size:72px; font-weight:800; color:var(--white); line-height:1; }
.hero-center .unit { font-size:15px; color:var(--cyan); font-weight:700; }
.hero-center .lbl { font-size:12px; color:var(--dim); margin-top:4px; }

.midrow { top:220px; height:52px; display:flex; gap:8px; }
.mid-chip { flex:1; background:var(--panel); border-left:2px solid var(--cyan); display:flex; align-items:center; justify-content:center; gap:8px; }

.battery-row { top:284px; height:70px; }
.battery-bar { position:relative; height:100%; overflow:hidden; background:var(--bar-bg); display:flex; align-items:center; border:1px solid var(--cyan); }
.battery-fill { position:absolute; left:0; top:0; bottom:0; width:91%; background:var(--cyan); }
.battery-label { position:relative; z-index:2; font-size:18px; font-weight:700; color:#000; margin-left:18px; }
.battery-value { position:absolute; right:18px; top:0; height:100%; display:flex; align-items:center; font-size:22px; font-weight:800; color:#000; z-index:2; }

.footer { top:368px; bottom:14px; display:flex; gap:8px; }
.throttle-card { flex:1; background:var(--panel); padding:10px 14px; }
.throttle-bar { margin-top:8px; height:10px; background:var(--bar-bg); overflow:hidden; }
.throttle-fill { width:27%; height:100%; background:var(--cyan); }
.side-card { flex:0 0 28%; background:var(--panel); display:flex; align-items:center; justify-content:center; }

.warn-note { position:absolute; bottom:-30px; left:0; font-size:11px; color:#888; }
</style></head>
<body>
<div class="screen">
  <span class="tag">白黒基調 + シアンブルー アクセント案</span>
  <div class="row topbar">
    <div class="side"><span class="label"><span class="dot" style="background:#555"></span>Disarmed</span><span class="label"><span class="dot" style="background:#555"></span>Motor off</span></div>
    <div class="side"><span class="value" style="font-size:13px;">22:35</span><span class="label" style="color:var(--cyan)">▂▄▆█</span></div>
  </div>
  <div class="row cluster">
    <div class="flank">
      <div class="cell"><span class="value">11.1v</span><span class="label">Volt</span></div>
      <div class="cell"><span class="value">3.67v</span><span class="label">Vcel</span></div>
    </div>
    <div class="hero-center">
      <span class="num">1750</span>
      <span class="unit">rpm</span>
      <span class="lbl">Headspeed</span>
    </div>
    <div class="flank">
      <div class="cell"><span class="value">0.9A</span><span class="label">Current</span></div>
      <div class="cell"><span class="value">5.0v</span><span class="label">Bec volt</span></div>
    </div>
  </div>
  <div class="row midrow">
    <div class="mid-chip"><span class="dot" style="background:#555"></span><span class="value" style="font-size:14px;">Gov spoolup</span></div>
    <div class="mid-chip"><span class="label">Flight</span><span class="value" style="font-size:15px; margin-left:6px;">00:48</span></div>
    <div class="mid-chip"><span class="label">Profile</span><span class="value" style="font-size:15px; margin-left:6px;">1/1</span></div>
  </div>
  <div class="row battery-row">
    <div class="battery-bar"><div class="battery-fill"></div><div class="battery-label">Battery</div><div class="battery-value">91% / 12mAh</div></div>
  </div>
  <div class="row footer">
    <div class="throttle-card">
      <div style="display:flex; justify-content:space-between;"><span class="label">Throttle</span><span class="value" style="font-size:14px;">27% / 32&deg;C</span></div>
      <div class="throttle-bar"><div class="throttle-fill"></div></div>
    </div>
    <div class="side-card"><span class="value" style="font-size:14px;">S2 Ultra</span></div>
  </div>
  <span class="warn-note">※ 警告画面(ARM/低電圧など)は視認性のため赤(#ff3b3b)を維持</span>
</div>
</body></html>
