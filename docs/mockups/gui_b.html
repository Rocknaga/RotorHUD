<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
:root {
  --bg:#0e0f11; --panel:#1c1e21; --accent-panel:#17181b; --accent-border:#2a2c30;
  --bar-bg:#2f333a; --dim:#9a9da3; --muted:#6b6c6c; --white:#f5f5f6;
  --green:#5dcaa5; --batt-good:#00e676; --grey:#888780; --blue-accent:#58aaf0;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:#050506; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
.screen { width:800px; height:480px; background:var(--bg); position:relative; overflow:hidden; margin:12px auto; border-radius:22px; }
.row { position:absolute; left:12px; right:12px; }
.label { color:var(--dim); font-size:12px; font-weight:600; }
.value { color:var(--white); font-weight:700; }
.sub { color:var(--muted); font-size:11px; font-weight:600; }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px; vertical-align:middle; }
.tag { position:absolute; top:-26px; left:0; font-size:13px; color:#5dcaa5; font-weight:700; }

.topbar { top:14px; height:32px; background:var(--panel); border-radius:16px; display:flex; align-items:center; padding:0 16px; justify-content:space-between; }
.topbar .side { display:flex; align-items:center; gap:16px; }

.main { top:54px; bottom:150px; display:flex; gap:10px; }
.left-col { flex:0 0 46%; display:flex; flex-direction:column; gap:10px; }
.hero { flex:1; background:var(--accent-panel); border:2px solid var(--accent-border); border-radius:18px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; }
.hero .num { font-size:70px; font-weight:800; color:var(--white); line-height:1; }
.hero .unit { font-size:16px; color:var(--dim); }
.hero .lbl { font-size:12px; color:var(--dim); margin-top:6px; }
.status-row { display:flex; gap:8px; height:44px; }
.status-chip { flex:1; background:var(--panel); border-radius:12px; display:flex; align-items:center; padding:0 12px; }

.right-col { flex:1; display:flex; flex-direction:column; gap:8px; }
.metric-line { flex:1; background:var(--panel); border-radius:12px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; }
.metric-line .value { font-size:19px; }

.battery-row { top:308px; height:72px; }
.battery-bar { position:relative; height:100%; border-radius:16px; overflow:hidden; background:var(--bar-bg); display:flex; align-items:center; }
.battery-fill { position:absolute; left:0; top:0; bottom:0; width:91%; background:var(--batt-good); }
.battery-label { position:relative; z-index:2; font-size:18px; font-weight:700; color:#06341f; margin-left:18px; }
.battery-value { position:absolute; right:18px; top:0; height:100%; display:flex; align-items:center; font-size:22px; font-weight:800; color:#06341f; z-index:2; }

.footer { top:392px; bottom:14px; display:flex; gap:8px; }
.throttle-card { flex:1; background:var(--panel); border-radius:14px; padding:10px 14px; }
.throttle-bar { margin-top:8px; height:10px; background:var(--bar-bg); border-radius:6px; overflow:hidden; }
.throttle-fill { width:27%; height:100%; background:var(--blue-accent); }
.side-card { flex:0 0 28%; background:var(--panel); border-radius:14px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; }
</style></head>
<body>
<div class="screen">
  <span class="tag">案B - コックピット分割型(左に主要情報を集約)</span>
  <div class="row topbar">
    <div class="side"><span class="label"><span class="dot" style="background:var(--grey)"></span>Disarmed</span><span class="label"><span class="dot" style="background:var(--grey)"></span>Motor off</span></div>
    <div class="side"><span class="value" style="font-size:13px;">22:35</span><span class="label">▂▄▆█</span></div>
  </div>
  <div class="row main">
    <div class="left-col">
      <div class="hero">
        <span class="num">1750</span>
        <span class="unit">rpm</span>
        <span class="lbl">Headspeed</span>
      </div>
      <div class="status-row">
        <div class="status-chip"><span class="dot"></span><span class="value" style="font-size:14px;">Gov spoolup</span></div>
        <div class="status-chip"><span class="label">Profile</span><span class="value" style="font-size:14px; margin-left:8px;">1/1</span></div>
      </div>
    </div>
    <div class="right-col">
      <div class="metric-line"><span class="label">Volt</span><span class="value">11.1v <span class="sub">min 11.0v</span></span></div>
      <div class="metric-line"><span class="label">Current</span><span class="value">0.9A <span class="sub">max 1.6A</span></span></div>
      <div class="metric-line"><span class="label">Vcel</span><span class="value">3.67v</span></div>
      <div class="metric-line"><span class="label">Bec volt</span><span class="value">5.0v <span class="sub">min 4.9v</span></span></div>
      <div class="metric-line"><span class="label">Flight</span><span class="value">00:48</span></div>
    </div>
  </div>
  <div class="row battery-row">
    <div class="battery-bar"><div class="battery-fill"></div><div class="battery-label">Battery</div><div class="battery-value">91% / 12mAh</div></div>
  </div>
  <div class="row footer">
    <div class="throttle-card">
      <div style="display:flex; justify-content:space-between;"><span class="label">Throttle</span><span class="value" style="font-size:14px;">27% / 32&deg;C</span></div>
      <div class="throttle-bar"><div class="throttle-fill"></div></div>
    </div>
    <div class="side-card"><span class="label">Model</span><span class="value" style="font-size:14px;">S2 Ultra</span></div>
  </div>
</div>
</body></html>
