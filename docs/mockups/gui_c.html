<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
:root {
  --bg:#0e0f11; --panel:#1c1e21; --accent-panel:#17181b; --accent-border:#2a2c30;
  --bar-bg:#2f333a; --dim:#9a9da3; --muted:#6b6c6c; --white:#f5f5f6;
  --green:#5dcaa5; --batt-good:#00e676; --grey:#888780; --blue-accent:#58aaf0;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:#050506; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
.screen { width:800px; height:480px; background:var(--bg); position:relative; overflow:hidden; margin:12px auto; border-radius:22px; }
.row { position:absolute; left:12px; right:12px; }
.label { color:var(--dim); font-size:12px; font-weight:600; }
.value { color:var(--white); font-weight:700; }
.sub { color:var(--muted); font-size:11px; font-weight:600; }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px; vertical-align:middle; }
.tag { position:absolute; top:-26px; left:0; font-size:13px; color:#5dcaa5; font-weight:700; }

.topbar { top:14px; height:32px; background:var(--panel); border-radius:16px; display:flex; align-items:center; padding:0 16px; justify-content:space-between; }
.topbar .side { display:flex; align-items:center; gap:16px; }

.cluster { top:54px; height:168px; background:var(--accent-panel); border:2px solid var(--accent-border); border-radius:20px;
  display:flex; align-items:stretch; padding:14px; gap:10px; }
.flank { flex:0 0 21%; display:flex; flex-direction:column; gap:8px; }
.flank .cell { flex:1; background:var(--panel-2, #21242a); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.flank .cell .value { font-size:17px; }
.flank .cell .label { font-size:10px; }
.hero-center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.hero-center .num { font-size:76px; font-weight:800; color:var(--white); line-height:1; }
.hero-center .unit { font-size:16px; color:var(--dim); }
.hero-center .lbl { font-size:12px; color:var(--dim); margin-top:4px; }

.midrow { top:234px; height:56px; display:flex; gap:8px; }
.mid-chip { flex:1; background:var(--panel); border-radius:12px; display:flex; align-items:center; justify-content:center; gap:8px; }

.battery-row { top:302px; height:76px; }
.battery-bar { position:relative; height:100%; border-radius:18px; overflow:hidden; background:var(--bar-bg); display:flex; align-items:center; }
.battery-fill { position:absolute; left:0; top:0; bottom:0; width:91%; background:var(--batt-good); }
.battery-label { position:relative; z-index:2; font-size:19px; font-weight:700; color:#06341f; margin-left:20px; }
.battery-value { position:absolute; right:20px; top:0; height:100%; display:flex; align-items:center; font-size:24px; font-weight:800; color:#06341f; z-index:2; }

.footer { top:390px; bottom:14px; display:flex; gap:8px; }
.throttle-card { flex:1; background:var(--panel); border-radius:14px; padding:8px 14px; }
.throttle-bar { margin-top:6px; height:10px; background:var(--bar-bg); border-radius:6px; overflow:hidden; }
.throttle-fill { width:27%; height:100%; background:var(--blue-accent); }
.side-card { flex:0 0 26%; background:var(--panel); border-radius:14px; display:flex; align-items:center; justify-content:center; }
</style></head>
<body>
<div class="screen">
  <span class="tag">案C - インストルメントクラスター型(Headspeedを中心に計器盤風)</span>
  <div class="row topbar">
    <div class="side"><span class="label"><span class="dot" style="background:var(--grey)"></span>Disarmed</span><span class="label"><span class="dot" style="background:var(--grey)"></span>Motor off</span></div>
    <div class="side"><span class="value" style="font-size:13px;">22:35</span><span class="label">▂▄▆█</span></div>
  </div>
  <div class="row cluster">
    <div class="flank">
      <div class="cell"><span class="value">11.1v</span><span class="label">Volt</span></div>
      <div class="cell"><span class="value">3.67v</span><span class="label">Vcel</span></div>
    </div>
    <div class="hero-center">
      <span class="num">1750</span>
      <span class="unit">rpm</span>
      <span class="lbl">Headspeed</span>
    </div>
    <div class="flank">
      <div class="cell"><span class="value">0.9A</span><span class="label">Current</span></div>
      <div class="cell"><span class="value">5.0v</span><span class="label">Bec volt</span></div>
    </div>
  </div>
  <div class="row midrow">
    <div class="mid-chip"><span class="dot"></span><span class="value" style="font-size:14px;">Gov spoolup</span></div>
    <div class="mid-chip"><span class="label">Flight</span><span class="value" style="font-size:15px;">00:48</span></div>
    <div class="mid-chip"><span class="label">Profile</span><span class="value" style="font-size:15px;">1/1</span></div>
  </div>
  <div class="row battery-row">
    <div class="battery-bar"><div class="battery-fill"></div><div class="battery-label">Battery</div><div class="battery-value">91% / 12mAh</div></div>
  </div>
  <div class="row footer">
    <div class="throttle-card">
      <div style="display:flex; justify-content:space-between;"><span class="label">Throttle</span><span class="value" style="font-size:14px;">27% / 32&deg;C</span></div>
      <div class="throttle-bar"><div class="throttle-fill"></div></div>
    </div>
    <div class="side-card"><span class="value" style="font-size:14px;">S2 Ultra</span></div>
  </div>
</div>
</body></html>
